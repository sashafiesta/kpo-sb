server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: file-service
          uri: http://file-service:8081
          predicates:
            - Path=/api/v1/files/**
        - id: analysis-service
          uri: http://analysis-service:8082
          predicates:
            - Path=/api/v1/reports/**
